name: Weekly market refresh
on:
  schedule: [{cron: "0 9 * * 1"}]
  workflow_dispatch:
concurrency:
  group: weekly-market-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh every connected target role
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -n "$APP_URL" ] && [ -n "$CRON_SECRET" ]; then
            offset=0
            failed_total=0
            while true; do
              result=$(curl --fail-with-body --silent --show-error --max-time 65 -X POST "$APP_URL/api/cron/refresh?offset=$offset" -H "Authorization: Bearer $CRON_SECRET")
              echo "$result" | jq '{mode, offset, roles, refreshedPostings, succeeded, failed, results}'
              page_failed=$(echo "$result" | jq -r '.failed // 0')
              failed_total=$((failed_total + page_failed))
              has_more=$(echo "$result" | jq -r '.hasMore // false')
              [ "$has_more" = "true" ] || break
              offset=$(echo "$result" | jq -r '.nextOffset')
            done
            [ "$failed_total" -eq 0 ] || exit 1
          else
            echo "Configure APP_URL and CRON_SECRET repository secrets to refresh connected user workspaces."
            exit 1
          fi
