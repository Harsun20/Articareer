name: Weekly market refresh
on:
  schedule: [{cron: "0 9 * * 1"}]
  workflow_dispatch:
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh demo and connected role data
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -n "$APP_URL" ] && [ -n "$CRON_SECRET" ]; then
            curl --fail-with-body --max-time 60 -X POST "$APP_URL/api/cron/refresh" -H "Authorization: Bearer $CRON_SECRET"
          else
            echo "Configure APP_URL and CRON_SECRET to refresh connected user workspaces."
          fi
